[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeprism-devtools"
version = "0.5.0"
description = "Adds Pokémon Prism support to Crystal Studio, plus Prism's own CLI tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ricccec", email = "65662894+ricccec@users.noreply.github.com"}]
requires-python = ">=3.11"
dependencies = ["pret-toolkit", "crystal-studio-api", "questionary", "Pillow"]

[project.scripts]
prism-dev       = "pokeprism_devtools.dev_server.cli:main"
prism-maps      = "pokeprism_devtools.map_inspect:main"
prism-map       = "pokeprism_devtools.map_show:main"
prism-mapview   = "pokeprism_devtools.mapview:main"
prism-gfx       = "pokeprism_devtools.gfx_view:main"
prism-mapfit    = "pokeprism_devtools.mapfit:main"
prism-metatiles = "pokeprism_devtools.metatiles:main"
prism-newmap    = "pokeprism_devtools.map_new:main"
prism-maplint   = "pokeprism_devtools.maplint:main"

# The mount discovers plugins through this group. The name is the
# seam's published ABI: every distribution that registers one has to
# spell it identically, and it is spelled once in code, in
# `crystal_studio_api/mount._GROUP`. Editing this needs a reinstall to take
# effect — entry points live in the dist metadata, not the source.
[project.entry-points."crystal_studio.plugins"]
prism = "pokeprism_devtools.prism.claim"

[project.urls]
Source = "https://github.com/ricccec/pokeprism-devtools"
Issues = "https://github.com/ricccec/pokeprism-devtools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pret-test]

[tool.pret-test.upstreams.pokecrystal]
url = "https://github.com/pret/pokecrystal"
commit = "31880ea20ea44f79ebd459b1e735ae1f15db1671"

[tool.pret-test.upstreams.pokeprism]
url = "https://github.com/ricccec/pokeprism"
commit = "aafe54a25df4a727a2a6368a4843165cd82649e8"
