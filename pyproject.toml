[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeprism-devtools"
version = "0.4.0"
description = "Python devtools for the pokeprism Pokémon Crystal disassembly fork"
requires-python = ">=3.10"
dependencies = ["questionary", "Pillow"]

[project.optional-dependencies]
# Only prism-studio needs a TUI toolkit, and the studio is one module: someone
# who wants the command-line tools shouldn't have to install a widget library to
# get them. `pip install pokeprism-devtools[studio]`.
#
# textual is pinned to a major: its widget and message APIs have moved in the
# past across *minor* releases, and a TUI that silently stops dispatching a
# message is a bad afternoon.
studio = ["textual>=8.2.8,<9"]

[project.scripts]
prism-dev     = "pokeprism_devtools.dev_server.cli:main"
prism-sym     = "pokeprism_devtools.sym_lookup:main"
prism-maps    = "pokeprism_devtools.map_inspect:main"
prism-map     = "pokeprism_devtools.map_show:main"
prism-usage   = "pokeprism_devtools.usage:main"
prism-mapview = "pokeprism_devtools.mapview:main"
prism-gfx     = "pokeprism_devtools.gfx_view:main"
prism-mapfit  = "pokeprism_devtools.mapfit:main"
prism-metatiles = "pokeprism_devtools.metatiles:main"
prism-newmap  = "pokeprism_devtools.map_new:main"
prism-maplint = "pokeprism_devtools.maplint:main"
prism-studio  = "pokeprism_devtools.studio:main"

# The mount discovers adapters through this group, so the three in-tree hacks
# register the same way a pip-installed third-party adapter would — the only way
# to learn whether the plugin seam holds before someone depends on it. Each value
# is the hack's claim module; the mount reads `claims(root)` off it. Editing this
# needs a reinstall to take effect (`pip install -e .`) — entry points live in
# the dist metadata, not the source.
[project.entry-points."pokeprism_devtools.hacks"]
prism    = "pokeprism_devtools.hacks.prism.claim"
vanilla  = "pokeprism_devtools.hacks.vanilla.claim"
polished = "pokeprism_devtools.hacks.polished.claim"

[tool.setuptools.packages.find]
where = ["src"]
